<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>4MEN - Quần Áo Nam</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="top-bar">
        <div>📞 Hotline: 0868.444.644</div>
        <div><a href="#" style="color:white;">Chính sách khách VIP</a></div>
    </div>

    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col-3">
                    <div class="logo">4MEN®</div>
                </div>
                <div class="col-9 text-end nav">
                    <a href="#" class="hot">HÀNG MỚI VỀ</a>
                    <a href="#">BỘ SƯU TẬP</a>
                    <a href="#">ÁO NAM</a>
                    <a href="#">QUẦN NAM</a>
                    <a href="#">PHỤ KIỆN</a>
                    <a href="#">OUTLET SALE</a>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-9">
                <div class="row" id="body">
                </div>
            </div>
            <div class="col-3">
                <div class="sidebar-left">
                    <h3>TÌM KIẾM</h3>
                    <input type="text" id="searchInput" placeholder="Từ khóa tìm kiếm...">

                    <h3>SẢN PHẨM HOT</h3>
                    <div class="hot-products" id="search-item">
                        <div class="product-mini">
                            <img
                                src="https://4menshop.com/images/thumbs/2024/12/ao-polo-theu-logo-tron-4m-form-slimfit-po153-mau-do-do-18919-slide-products-6758ffb871061.jpg">
                            <div>
                                <p>Áo Polo Đen</p>
                                <p class="price">189.000₫</p>
                            </div>
                        </div>

                        <div class="product-mini">
                            <img
                                src="https://4menshop.com/images/thumbs/2024/12/quan-tay-tron-form-slimfit-qt058-mau-den-18346-slide-products-676fd5101614f.jpg">
                            <div>
                                <p>Quần Tây Đen</p>
                                <p class="price">299.000₫</p>
                            </div>
                        </div>

                        <div class="product-mini">
                            <img
                                src="https://4menshop.com/images/thumbs/2023/01/ao-so-mi-regular-tron-tay-dai-sm088-mau-do-do-16898-slide-products-63b5553e5ee4d.jpg">
                            <div>
                                <p>Sơ Mi Đỏ Đô</p>
                                <p class="price">199.000₫</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for item details -->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailModalLabel">Item Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Details will be dynamically loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
